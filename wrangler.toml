# Cloudflare Workers static assets (CI runs `npm run build` before `wrangler deploy`).
# assets.html_handling must be: auto-trailing-slash | force-trailing-slash | drop-trailing-slash | none
name = "palworldhacks-com"
compatibility_date = "2026-11-05"

[build]
command = "npm ci && npm run build"

[build.environment]
SITE_ORIGIN = "https://palworldhacks-com.uroojroziroti.workers.dev"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
